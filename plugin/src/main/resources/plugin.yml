name: RandomWars
version: '${version}'
main: com.randomwars.RandomWarsPlugin
api-version: '1.21.11'
description: 랜덤무기전쟁
authors: [mireu9275]

commands:
  rw:
    description: RandomWars 관리 명령
    usage: /rw <version|reload|box|weapon|spawn|zone>
  입장:
    description: 플레이존에 입장합니다
    aliases: [join]
  로비:
    description: 제자리에서 잠시 기다린 뒤 로비로 돌아갑니다
    aliases: [lobby]

permissions:
  randomwars.admin:
    description: RandomWars 관리 명령 사용
    default: op
