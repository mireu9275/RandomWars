# 로비와 플레이존 설정
# 월드가 없으면 서버 시작 시 자동으로 만든다. 진짜 맵을 쓸 때는 맵 폴더를 서버 폴더에 넣고 world 이름만 바꾸면 된다.
lobby:
  world: rw_lobby
  # 비워두면 월드 스폰 지점
  spawn: ''

play:
  world: rw_play
  # 플레이존 경계 (월드보더). center 는 x,z / size 는 한 변 길이(블록)
  center: [0, 0]
  size: 300
  # random: 경계 안 랜덤 좌표 (자연 지형용)
  # points: /rw spawn add 로 등록한 후보 지점 중 무작위 (건물 맵용)
  warp-mode: random
  # 다른 플레이어와 최소 거리
  min-player-distance: 30
  # 입장 직후 무적 시간(초)
  invulnerable-seconds: 3
  # 한 목숨당 입장 보상 (일반 랜덤상자 개수)
  entry-boxes: 2

kill-reward:
  boxes: 1
  # 마지막 타격자가 없을 때 최근 공격자로 인정하는 시간(초)
  assist-seconds: 10
  # 같은 상대를 이 시간(초) 안에 다시 처치하면 보상 없음
  same-victim-cooldown-seconds: 300

lobby-command:
  # /로비 대기 시간(초). 움직이면 취소
  wait-seconds: 5

# /rw spawn add 로 등록된 후보 지점 (직접 고쳐도 된다)
spawn-points: []
