# 무기 정의 (MVP 12종)
# id 는 PDC(randomwars:weapon_id)에 저장되므로 한번 정하면 바꾸지 않는다.
# grade: common | rare | epic | legendary
# material: 바닐라 아이템 (기본 공격과 외형의 바탕). 활·방패의 바닐라 우클릭 동작은 스킬로 대체된다.
# model: 리소스팩 item_model (선택). 없으면 바닐라 외형 그대로.
# roles: 역할 태그 (상성표용)
# skill: 우클릭 스킬, shift-skill: 웅크리기+우클릭 스킬
#   cooldown(초), range(조준 거리), parts: 스킬 부품 목록 (순서대로 실행)
#
# 스킬 부품
#   damage       {damage}                               조준 대상에게 바로 피해
#   dash         {power, damage, knockback}             바라보는 방향으로 돌진, 경로의 적 타격 (둔화 중이면 약해짐)
#   blink_behind {distance}                             조준 대상 등 뒤로 순간이동
#   flurry       {hits, damage, interval(틱), reach}    짧은 시간 연타 (대상이 reach 안에 있어야 계속 들어감)
#   stun         {seconds}                              기절: 이동·스킬 불가
#   slow         {seconds, amplifier, radius}           둔화 (radius 0 = 조준 대상, 아니면 주변 전체)
#   knockback    {power, radius, damage}                주변을 밀어냄
#   projectile   {speed, gravity, count, spread, item, damage, on-hit: [부품...]}
#   explosion    {radius, damage, knockback, at: origin|self|front|look, range}
#   shield       {amount, seconds}                      받는 피해를 amount 만큼 흡수
#   mark         {multiplier, seconds}                  대상이 받는 피해 증가 + 발광
#
# 상성 (MVP)
#   연계: 그림자 단도(등 뒤 이동) → 연격 쌍검(연타)
#   카운터: 연타 ↔ 보호막(나무 방패, 수호자의 방패) / 돌진 ↔ 둔화(서리 지팡이) / 원거리 ↔ 돌진(돌격 창)
weapons:
  rusty_dagger:
    name: 녹슨 단검
    grade: common
    material: IRON_SWORD
    roles: [폭딜]
    skill:
      name: 급소 찌르기
      cooldown: 12
      range: 4
      parts:
        - {type: flurry, hits: 3, damage: 2, interval: 4, reach: 4}

  woodcutter_axe:
    name: 나무꾼 도끼
    grade: common
    material: STONE_AXE
    roles: [폭딜, 제어]
    skill:
      name: 내려찍기
      cooldown: 14
      parts:
        - {type: explosion, at: front, radius: 2.5, damage: 5, knockback: 0.6}

  training_bow:
    name: 훈련용 활
    grade: common
    material: BOW
    roles: [원거리]
    skill:
      name: 세 발 쏘기
      cooldown: 12
      parts:
        - {type: projectile, item: ARROW, speed: 2.5, gravity: true, count: 3, spread: 5, damage: 3}

  wooden_buckler:
    name: 나무 방패
    grade: common
    material: SHIELD
    roles: [방어]
    skill:
      name: 막아서기
      cooldown: 18
      parts:
        - {type: shield, amount: 6, seconds: 5}

  frost_wand:
    name: 서리 지팡이
    grade: common
    material: BLAZE_ROD
    roles: [제어, 원거리]
    description: 돌진하는 상대를 느리게 만든다
    skill:
      name: 서리 화살
      cooldown: 10
      parts:
        - type: projectile
          item: SNOWBALL
          speed: 2.2
          damage: 2
          on-hit:
            - {type: slow, seconds: 4, amplifier: 2}

  shadow_blade:
    name: 그림자 단도
    grade: rare
    material: GOLDEN_SWORD
    roles: [이동]
    description: 연격 쌍검과 함께 쓰면 뒤를 잡고 순삭
    skill:
      name: 그림자 걸음
      cooldown: 10
      range: 14
      parts:
        - {type: blink_behind, distance: 1.3}
        - {type: damage, damage: 2}

  twin_blades:
    name: 연격 쌍검
    grade: rare
    material: DIAMOND_SWORD
    roles: [폭딜]
    description: 가까이 붙어야 모든 타격이 들어간다
    skill:
      name: 난도질
      cooldown: 12
      range: 4
      parts:
        - {type: flurry, hits: 7, damage: 2.2, interval: 2, reach: 4.5}

  charge_lance:
    name: 돌격 창
    grade: rare
    material: IRON_AXE
    roles: [이동, 폭딜]
    description: 원거리 무기를 든 상대에게 순식간에 붙는다
    skill:
      name: 돌격
      cooldown: 9
      parts:
        - {type: dash, power: 2.2, damage: 5, knockback: 0.9}

  hunter_crossbow:
    name: 사냥꾼 석궁
    grade: rare
    material: CROSSBOW
    roles: [원거리]
    skill:
      name: 표식 사격
      cooldown: 12
      parts:
        - type: projectile
          item: ARROW
          speed: 3.5
          damage: 6
          on-hit:
            - {type: mark, multiplier: 1.3, seconds: 6}

  guardian_aegis:
    name: 수호자의 방패
    grade: epic
    material: SHIELD
    roles: [방어, 제어]
    description: 연타를 받아내고 밀쳐낸다
    skill:
      name: 수호의 벽
      cooldown: 16
      parts:
        - {type: shield, amount: 12, seconds: 6}
        - {type: knockback, radius: 3.5, power: 1.3}
    shift-skill:
      name: 방패 강타
      cooldown: 12
      range: 4
      parts:
        - {type: damage, damage: 3}
        - {type: stun, seconds: 1.2}

  blast_staff:
    name: 폭발 지팡이
    grade: epic
    material: BREEZE_ROD
    roles: [원거리, 폭딜]
    skill:
      name: 화염구
      cooldown: 10
      parts:
        - type: projectile
          item: FIRE_CHARGE
          speed: 1.8
          damage: 3
          on-hit:
            - {type: explosion, radius: 3, damage: 5, knockback: 0.8}
    shift-skill:
      name: 돌풍
      cooldown: 12
      parts:
        - {type: knockback, radius: 5, power: 1.6, damage: 2}

  thunder_hammer:
    name: 천둥 망치
    grade: legendary
    material: MACE
    roles: [제어, 폭딜]
    skill:
      name: 천둥 강타
      cooldown: 18
      range: 20
      parts:
        - {type: explosion, at: look, range: 20, radius: 4, damage: 8, knockback: 1.0}
    shift-skill:
      name: 망치 도약
      cooldown: 12
      range: 5
      parts:
        - {type: dash, power: 1.6, damage: 4, knockback: 0.5}
        - {type: slow, radius: 4, seconds: 2, amplifier: 3}
